[project]
name = "comfyui-kinetix-bridge"
description = "MiniMax-H3 5120-d Combat Semantic Bridge for High-Impact Martial Arts and Combat Action Video Generation"
version = "1.1.0"
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = [
    "torch>=2.0.0",
    "safetensors>=0.4.0",
    "numpy>=1.22.0",
    "huggingface_hub",
]

[project.urls]
Repository = "https://github.com/luluka-code/ComfyUI-KinetiX-Bridge"

[tool.comfy]
PublisherId = "kinetix"
DisplayName = "ComfyUI-KinetiX-Bridge"
Icon = ""

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
